server:
  port: ${PORT:8080}

spring:
  application:
    name: points-exchange-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/points-exchange;MODE=MYSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  legacy-static-path: ${APP_LEGACY_STATIC_PATH:./legacy-static}
  seed-admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
  seed-admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}
  seed-user-username: ${APP_SEED_USER_USERNAME:demo}
  seed-user-password: ${APP_SEED_USER_PASSWORD:demo123}
  seed-user-phone: ${APP_SEED_USER_PHONE:13800000000}
  sms-mock-enabled: ${APP_SMS_MOCK_ENABLED:true}
  sms-code-ttl-seconds: ${APP_SMS_CODE_TTL_SECONDS:300}
  sms-resend-interval-seconds: ${APP_SMS_RESEND_INTERVAL_SECONDS:60}
