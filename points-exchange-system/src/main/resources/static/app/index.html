<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 积分兑换系统</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<div class="page-shell">
    <aside class="sidebar">
        <div class="logo">
            <img src="/res/default/bg/image/icon/logo.png" alt="logo">
            <div>
                <strong>积分商城</strong>
                <div class="muted" style="color:#cbd5e1;">用户端</div>
            </div>
        </div>
        <a class="nav-link" href="#items">兑换商品</a>
        <a class="nav-link" href="#cart">购物车</a>
        <a class="nav-link" href="#checkout">结算</a>
        <a class="nav-link" href="#orders">我的订单</a>
        <a class="nav-link" href="#profile">我的次数</a>
    </aside>
    <main class="main">
        <div class="topbar">
            <div>
                <h1 class="headline">欢迎回来</h1>
                <div class="muted" id="welcomeText">加载中...</div>
            </div>
            <button class="btn btn-secondary" id="logoutBtn">退出登录</button>
        </div>

        <section id="profile" class="grid cards" style="margin-bottom:24px;">
            <div class="card">
                <div class="muted">剩余兑换次数</div>
                <div class="metric" id="redeemRemaining">0</div>
            </div>
            <div class="card">
                <div class="muted">最近订单</div>
                <div class="metric" id="orderCount">0</div>
            </div>
            <div class="card">
                <div class="muted">可兑换商品</div>
                <div class="metric" id="itemCount">0</div>
            </div>
        </section>

        <section id="items" class="stack" style="margin-bottom:24px;">
            <div class="section-head">
                <h2 style="margin:0;">兑换商品</h2>
                <span class="muted">使用原项目素材作为展示图</span>
            </div>
            <div class="item-grid" id="itemGrid"></div>
        </section>

        <section id="cart" class="card" style="margin-bottom:24px;">
            <div class="section-head">
                <h2 style="margin:0;">购物车</h2>
                <div style="display:flex; gap:12px; align-items:center;">
                    <div class="muted">合计消耗 <span id="cartTotalQty">0</span> 次</div>
                    <button class="btn btn-primary" id="goCheckoutBtn">去结算</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>商品</th>
                        <th>库存</th>
                        <th>数量</th>
                        <th>次数</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="cartTable"></tbody>
                </table>
            </div>
        </section>

        <section id="checkout" class="card" style="margin-bottom:24px;">
            <div class="section-head">
                <h2 style="margin:0;">结算</h2>
                <div class="muted">
                    本次消耗 <span id="checkoutTotalQty">0</span> 次，
                    剩余 <span id="checkoutRemaining">0</span> 次，
                    结算后剩余 <span id="checkoutAfter">0</span> 次
                </div>
            </div>
            <div class="grid" style="grid-template-columns: 1fr; gap: 14px;">
                <div class="form-group">
                    <label>收货人</label>
                    <input id="checkoutRecipient" placeholder="请输入收货人">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input id="checkoutPhone" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label>收货地址</label>
                    <textarea id="checkoutAddress" placeholder="请输入收货地址"></textarea>
                </div>
                <div style="display:flex; gap:12px;">
                    <button class="btn btn-secondary" id="clearCartBtn">清空购物车</button>
                    <button class="btn btn-primary" id="submitCheckoutBtn">提交订单</button>
                </div>
            </div>
        </section>

        <section id="orders" class="card" style="margin-bottom:24px;">
            <div class="section-head">
                <h2 style="margin:0;">我的订单</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>订单号</th>
                        <th>商品</th>
                        <th>数量</th>
                        <th>次数</th>
                        <th>状态</th>
                        <th>收货人</th>
                        <th>物流</th>
                    </tr>
                    </thead>
                    <tbody id="orderTable"></tbody>
                </table>
            </div>
        </section>

        
    </main>
</div>

<script src="/js/http.js"></script>
<script>
    const CART_KEY = "jfdh_cart_v1";
    let lastHome = null;

    function loadCart() {
        try {
            const raw = localStorage.getItem(CART_KEY);
            const obj = raw ? JSON.parse(raw) : {};
            if (!obj || typeof obj !== "object") {
                return {};
            }
            return obj;
        } catch (e) {
            return {};
        }
    }

    function saveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart || {}));
    }

    function cartItems() {
        const cart = loadCart();
        return Object.keys(cart).map(key => ({
            itemId: Number(key),
            quantity: Number(cart[key])
        })).filter(it => it.itemId && it.quantity > 0);
    }

    function cartTotalQuantity() {
        return cartItems().reduce((sum, it) => sum + it.quantity, 0);
    }

    function renderCart() {
        const items = lastHome?.items || [];
        const itemMap = new Map(items.map(i => [i.id, i]));
        const list = cartItems();
        const totalQty = cartTotalQuantity();
        document.getElementById("cartTotalQty").textContent = totalQty;
        document.getElementById("checkoutTotalQty").textContent = totalQty;

        const remaining = lastHome?.profile?.redeemRemaining ?? 0;
        document.getElementById("checkoutRemaining").textContent = remaining;
        document.getElementById("checkoutAfter").textContent = Math.max(0, remaining - totalQty);

        if (list.length === 0) {
            document.getElementById("cartTable").innerHTML = '<tr><td colspan="5">购物车为空</td></tr>';
            return;
        }

        document.getElementById("cartTable").innerHTML = list.map(row => {
            const item = itemMap.get(row.itemId);
            if (!item) {
                return "";
            }
            return `
                <tr>
                    <td>${escapeHtml(item.name)}</td>
                    <td>${item.stock}</td>
                    <td style="max-width:160px;">
                        <input type="number" min="1" max="${item.stock}" value="${row.quantity}"
                               onchange="updateCartQty(${item.id}, this.value)">
                    </td>
                    <td>${row.quantity}</td>
                    <td><button class="btn btn-secondary" onclick="removeFromCart(${item.id})">移除</button></td>
                </tr>
            `;
        }).join("") || '<tr><td colspan="5">购物车为空</td></tr>';
    }

    function updateCartQty(itemId, value) {
        const items = lastHome?.items || [];
        const item = items.find(i => i.id === itemId);
        if (!item) {
            return;
        }
        const qty = Math.max(1, Math.min(item.stock, Number(value) || 1));
        const cart = loadCart();
        cart[String(itemId)] = qty;
        saveCart(cart);
        renderCart();
    }

    function removeFromCart(itemId) {
        const cart = loadCart();
        delete cart[String(itemId)];
        saveCart(cart);
        renderCart();
    }

    function clearCart() {
        saveCart({});
        renderCart();
    }

    function addToCart(itemId) {
        const items = lastHome?.items || [];
        const item = items.find(i => i.id === itemId);
        if (!item) {
            alert("商品不存在");
            return;
        }
        const qty = Math.max(1, Math.min(item.stock, Number(document.getElementById(`qty-${itemId}`).value) || 1));
        const cart = loadCart();
        const current = Number(cart[String(itemId)] || 0);
        const next = Math.min(item.stock, current + qty);
        cart[String(itemId)] = next;
        saveCart(cart);
        renderCart();
        location.hash = "#cart";
    }

    async function refreshPage() {
        const home = await api("/api/app/home");
        lastHome = home;
        const profile = home.profile;
        document.getElementById("welcomeText").textContent = `${profile.displayName}，账号：${profile.username}`;
        document.getElementById("redeemRemaining").textContent = profile.redeemRemaining ?? 0;
        document.getElementById("orderCount").textContent = home.recentOrders.length;
        document.getElementById("itemCount").textContent = home.items.length;

        document.getElementById("itemGrid").innerHTML = home.items.map(item => `
            <div class="card item-card">
                <img src="${escapeHtml(item.coverImage)}" alt="${escapeHtml(item.name)}">
                <h3>${escapeHtml(item.name)}</h3>
                <div class="muted">${escapeHtml(item.description)}</div>
                <div class="meta">
                    <span class="tag">消耗 1 次</span>
                    <span class="muted">库存 ${item.stock}</span>
                </div>
                <div class="form-group">
                    <label>兑换数量</label>
                    <input id="qty-${item.id}" type="number" value="1" min="1" max="${item.stock}">
                </div>
                <button class="btn btn-primary" onclick="addToCart(${item.id})">加入购物车</button>
            </div>
        `).join("");

        document.getElementById("orderTable").innerHTML = home.recentOrders.map(order => `
            <tr>
                <td>${escapeHtml(order.orderNo)}</td>
                <td>${escapeHtml(order.itemName)}</td>
                <td>${order.quantity}</td>
                <td>${order.quantity}</td>
                <td>${escapeHtml(order.status)}</td>
                <td>${escapeHtml(order.recipientName)}</td>
                <td>${
                    order.trackingUrl
                        ? `<a href="${escapeHtml(order.trackingUrl)}" target="_blank">查看物流</a><div class="muted" style="margin-top:4px;">${escapeHtml(order.trackingNo || "")}</div>`
                        : "-"
                }</td>
            </tr>
        `).join("") || '<tr><td colspan="7">暂无订单</td></tr>';

        renderCart();
    }

    async function submitCheckout() {
        const list = cartItems();
        if (list.length === 0) {
            alert("购物车为空");
            return;
        }
        const recipientName = document.getElementById("checkoutRecipient").value.trim();
        const phone = document.getElementById("checkoutPhone").value.trim();
        const address = document.getElementById("checkoutAddress").value.trim();
        if (!recipientName) {
            alert("请输入收货人");
            return;
        }
        if (!phone) {
            alert("请输入手机号");
            return;
        }
        if (!address) {
            alert("请输入收货地址");
            return;
        }
        try {
            await api("/api/app/orders/checkout", {
                method: "POST",
                body: JSON.stringify({
                    items: list,
                    recipientName,
                    phone,
                    address
                })
            });
            clearCart();
            alert("下单成功");
            await refreshPage();
            location.hash = "#orders";
        } catch (e) {
            alert(e.message);
        }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
        await api("/api/auth/logout", { method: "POST" });
        location.href = "/app/login.html";
    });

    document.getElementById("goCheckoutBtn").addEventListener("click", () => {
        renderCart();
        location.hash = "#checkout";
    });

    document.getElementById("submitCheckoutBtn").addEventListener("click", submitCheckout);
    document.getElementById("clearCartBtn").addEventListener("click", () => {
        if (confirm("确定要清空购物车吗？")) {
            clearCart();
        }
    });

    refreshPage().catch(() => {
        location.href = "/app/login.html";
    });
</script>
</body>
</html>
