<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 积分兑换系统</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<div class="page-shell">
    <aside class="sidebar">
        <div class="logo">
            <img src="/res/default/bg/image/icon/logo.png" alt="logo">
            <div>
                <strong>积分商城</strong>
                <div class="muted" style="color:#cbd5e1;">用户端</div>
            </div>
        </div>
        <a class="nav-link" href="#items">兑换商品</a>
        <a class="nav-link" href="#orders">我的订单</a>
        <a class="nav-link" href="#transactions">积分流水</a>
    </aside>
    <main class="main">
        <div class="topbar">
            <div>
                <h1 class="headline">欢迎回来</h1>
                <div class="muted" id="welcomeText">加载中...</div>
            </div>
            <button class="btn btn-secondary" id="logoutBtn">退出登录</button>
        </div>

        <section class="grid cards" style="margin-bottom:24px;">
            <div class="card">
                <div class="muted">当前积分</div>
                <div class="metric" id="pointsBalance">0</div>
            </div>
            <div class="card">
                <div class="muted">最近订单</div>
                <div class="metric" id="orderCount">0</div>
            </div>
            <div class="card">
                <div class="muted">可兑换商品</div>
                <div class="metric" id="itemCount">0</div>
            </div>
        </section>

        <section id="items" class="stack" style="margin-bottom:24px;">
            <div class="section-head">
                <h2 style="margin:0;">兑换商品</h2>
                <span class="muted">使用原项目素材作为展示图</span>
            </div>
            <div class="item-grid" id="itemGrid"></div>
        </section>

        <section id="orders" class="card" style="margin-bottom:24px;">
            <div class="section-head">
                <h2 style="margin:0;">我的订单</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>订单号</th>
                        <th>商品</th>
                        <th>数量</th>
                        <th>积分</th>
                        <th>状态</th>
                        <th>收货人</th>
                        <th>物流</th>
                    </tr>
                    </thead>
                    <tbody id="orderTable"></tbody>
                </table>
            </div>
        </section>

        <section id="transactions" class="card">
            <div class="section-head">
                <h2 style="margin:0;">积分流水</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>类型</th>
                        <th>变动</th>
                        <th>余额</th>
                        <th>来源</th>
                        <th>说明</th>
                    </tr>
                    </thead>
                    <tbody id="transactionTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="/js/http.js"></script>
<script>
    async function refreshPage() {
        const home = await api("/api/app/home");
        const profile = home.profile;
        document.getElementById("welcomeText").textContent = `${profile.displayName}，账号：${profile.username}`;
        document.getElementById("pointsBalance").textContent = profile.pointsBalance;
        document.getElementById("orderCount").textContent = home.recentOrders.length;
        document.getElementById("itemCount").textContent = home.items.length;

        document.getElementById("itemGrid").innerHTML = home.items.map(item => `
            <div class="card item-card">
                <img src="${escapeHtml(item.coverImage)}" alt="${escapeHtml(item.name)}">
                <h3>${escapeHtml(item.name)}</h3>
                <div class="muted">${escapeHtml(item.description)}</div>
                <div class="meta">
                    <span class="tag">${item.pointsCost} 积分</span>
                    <span class="muted">库存 ${item.stock}</span>
                </div>
                <div class="form-group">
                    <label>兑换数量</label>
                    <input id="qty-${item.id}" type="number" value="1" min="1" max="${item.stock}">
                </div>
                <div class="form-group">
                    <label>收货人</label>
                    <input id="recipient-${item.id}" placeholder="请输入收货人">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input id="phone-${item.id}" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label>收货地址</label>
                    <textarea id="address-${item.id}" placeholder="请输入收货地址"></textarea>
                </div>
                <button class="btn btn-primary" onclick="redeem(${item.id})">立即兑换</button>
            </div>
        `).join("");

        document.getElementById("orderTable").innerHTML = home.recentOrders.map(order => `
            <tr>
                <td>${escapeHtml(order.orderNo)}</td>
                <td>${escapeHtml(order.itemName)}</td>
                <td>${order.quantity}</td>
                <td>${order.totalPoints}</td>
                <td>${escapeHtml(order.status)}</td>
                <td>${escapeHtml(order.recipientName)}</td>
                <td>${
                    order.trackingUrl
                        ? `<a href="${escapeHtml(order.trackingUrl)}" target="_blank">查看物流</a><div class="muted" style="margin-top:4px;">${escapeHtml(order.trackingNo || "")}</div>`
                        : "-"
                }</td>
            </tr>
        `).join("") || '<tr><td colspan="7">暂无订单</td></tr>';

        document.getElementById("transactionTable").innerHTML = home.transactions.map(tx => `
            <tr>
                <td>${escapeHtml(tx.type)}</td>
                <td>${tx.changeAmount > 0 ? "+" : ""}${tx.changeAmount}</td>
                <td>${tx.balanceAfter}</td>
                <td>${escapeHtml(tx.source)}</td>
                <td>${escapeHtml(tx.note)}</td>
            </tr>
        `).join("") || '<tr><td colspan="5">暂无流水</td></tr>';
    }

    async function redeem(itemId) {
        try {
            await api("/api/app/orders", {
                method: "POST",
                body: JSON.stringify({
                    itemId,
                    quantity: Number(document.getElementById(`qty-${itemId}`).value),
                    recipientName: document.getElementById(`recipient-${itemId}`).value.trim(),
                    phone: document.getElementById(`phone-${itemId}`).value.trim(),
                    address: document.getElementById(`address-${itemId}`).value.trim()
                })
            });
            alert("兑换成功");
            await refreshPage();
        } catch (e) {
            alert(e.message);
        }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
        await api("/api/auth/logout", { method: "POST" });
        location.href = "/app/login.html";
    });

    refreshPage().catch(() => {
        location.href = "/app/login.html";
    });
</script>
</body>
</html>
