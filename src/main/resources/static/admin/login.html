<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 - 福利兑换平台</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="login-page">
<div class="login-card">
    <img src="/res/default/bg/image/icon/logo1.png" alt="logo">
    <h1>运营后台</h1>
    <p>管理积分商品、用户积分、兑换订单和最近流水</p>
    <div class="form-group">
        <label for="username">管理员账号</label>
        <input id="username" value="admin" autocomplete="username">
    </div>
    <div class="form-group">
        <label for="password">密码</label>
        <input id="password" type="password" value="admin123" autocomplete="current-password">
    </div>
    <div class="error-text" id="error"></div>
    <button class="btn btn-primary" style="width:100%" id="loginBtn">登录后台</button>
    <p style="margin-top:16px;">普通用户请前往 <a href="/app/login.html" style="color:#2563eb;">用户登录</a></p>
</div>
<script src="/js/http.js"></script>
<script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
        const error = document.getElementById("error");
        error.textContent = "";
        try {
            const data = await api("/api/auth/login", {
                method: "POST",
                body: JSON.stringify({
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value.trim()
                })
            });
            if (data.role !== "ADMIN") {
                await api("/api/auth/logout", { method: "POST" });
                throw new Error("当前账号不是管理员");
            }
            location.href = "/admin/index.html";
        } catch (e) {
            error.textContent = e.message;
        }
    });
</script>
</body>
</html>
