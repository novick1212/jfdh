<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 积分兑换系统</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="login-page">
<div class="login-card">
    <h1>福利兑换系统</h1>
    <p>请输入姓名和人力资源码登录</p>
    <div class="form-group">
        <label for="displayName">姓名</label>
        <input id="displayName" placeholder="请输入姓名" autocomplete="name">
    </div>
    <div class="form-group">
        <label for="hrCode">人力资源码</label>
        <input id="hrCode" placeholder="请输入人力资源码" autocomplete="off">
    </div>
    <div class="error-text" id="error"></div>
    <button class="btn btn-primary" style="width:100%" id="loginBtn">登录用户端</button>
    <p style="margin-top:16px;">管理员请前往 <a href="/admin/login.html" style="color:#2563eb;">后台登录</a></p>
</div>
<script src="/js/http.js"></script>
<script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
        const error = document.getElementById("error");
        error.textContent = "";
        try {
            const data = await api("/api/auth/sms-login", {
                method: "POST",
                body: JSON.stringify({
                    displayName: document.getElementById("displayName").value.trim(),
                    hrCode: document.getElementById("hrCode").value.trim()
                })
            });
            if (data.role === "ADMIN") {
                location.href = "/admin/index.html";
                return;
            }
            location.href = "/app/index.html";
        } catch (e) {
            error.textContent = e.message;
        }
    });
</script>
</body>
</html>
